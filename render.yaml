# Render free-tier blueprint.
# 1. Push this repo to GitHub
# 2. https://dashboard.render.com → New + → Blueprint → connect this repo
# 3. Set the env vars marked "sync: false" in the Render dashboard
services:
  - type: web
    name: getjob-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install --with-deps chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEFAULT_LOCATION
        value: Israel
      - key: DEFAULT_EMAIL
        value: jackamichai@gmail.com
      - key: SCAN_CRON
        value: 0 10 * * *
      - key: RELEVANCE_THRESHOLD
        value: 75
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-7
      - key: SCRAPER_HEADLESS
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
